server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: rams-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/research_assistant_management}
    username: ${SPRING_DATASOURCE_USERNAME:rams}
    password: ${SPRING_DATASOURCE_PASSWORD:rams}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

rams:
  jwt:
    # Local default only. Set JWT_SECRET to a private value of at least 32 bytes.
    secret: ${JWT_SECRET:local-dev-only-change-this-secret-to-32-bytes-or-more}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
