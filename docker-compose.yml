services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: research_assistant_management
      POSTGRES_USER: rams
      POSTGRES_PASSWORD: rams
    ports:
      - "5433:5432"
    volumes:
      - rams-pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rams -d research_assistant_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rams-pg:
